name: Paper code tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.3'
      - name: Install locked Linux environment
        if: runner.os == 'Linux'
        run: python -m pip install --require-hashes -r requirements/review-linux.lock
      - name: Install locked Windows environment
        if: runner.os == 'Windows'
        run: python -m pip install --require-hashes -r requirements/review-windows.lock
      - run: python -m pip check
      - run: python -m pytest tests -q --basetemp tmp/ci-tests
      - run: python scripts/verify_paper_results.py
