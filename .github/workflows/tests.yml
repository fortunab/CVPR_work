name: Paper code tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install portable classifier requirements
        run: python -m pip install -r requirements/reviewer-heads.txt
      - name: Check the reviewer environment
        run: python scripts/check_reviewer_environment.py --profile heads
      - run: python -m pip check
      - run: python -m pytest tests -q --basetemp tmp/ci-tests
      - run: python scripts/verify_paper_results.py
